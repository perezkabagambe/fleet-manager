name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp commit ID and build time
        run: |
          SHORT="${GITHUB_SHA::7}"
          NOW="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed -i "s/__COMMIT__/${SHORT}/g; s/__BUILT_AT__/${NOW}/g" web/config.js web/sw.js
          grep -n "commit\|VERSION" web/config.js web/sw.js | head

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
